name: Deploy to GitHub Pages

# Builds the Vite app and publishes dist/ to GitHub Pages on every push to the
# default branch. This file assumes the app is at the REPOSITORY ROOT (as in the
# standalone Pre-Assisgn repo). GitHub only runs workflows from the repo-root
# .github/workflows/ directory.
#
# ONE-TIME SETUP:
#   1) Repo → Settings → Pages → Build and deployment → Source: "GitHub Actions".
#   2) (Optional, for the AI Assistant tab) Repo → Settings → Secrets and
#      variables → Actions → New repository secret:
#        Name:  GEMINI_API_KEY
#        Value: <your Gemini API key from https://aistudio.google.com/apikey>
#      NOTE: a client-side key is embedded in the published bundle and is
#      therefore PUBLIC. Use a key restricted/rotated for this use, or leave the
#      secret unset to ship the dashboard without the assistant.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
