Screens:
  scrMe:
    Properties:
      Fill: =T.bg
      OnVisible: |-
        =Set(varMyKey, Text(Today(), "yyyy-mm-dd"));
        If(IsBlank(varMyCode) && !IsBlank(varMe.emp_code), Set(varMyCode, varMe.emp_code));
        Set(varMeEmp, LookUp(PAS_Employees, emp_code = varMyCode));
        ClearCollect(colMe, Filter(PAS_Assignment, day_key = varMyKey, emp_code = varMyCode))
    Children:
      - recMeTop:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =64
            Fill: =T.brand
      - lblMeTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="📋 งานของฉันวันนี้"
            X: =16
            Y: =6
            Width: =Parent.Width - 280
            Height: =30
            Size: =If(Parent.Width < 760, 14, 17)
            Color: =Color.White
            Font: =T.font
            FontWeight: =FontWeight.Bold
      - lblMeWho:
          Control: Label@2.5.1
          Properties:
            Text: =Coalesce(varMeEmp.name_th, varMeEmp.name_en, varMyCode) & "  ·  " & Text(Today(), "d mmm yyyy")
            X: =16
            Y: =36
            Width: =Parent.Width - 280
            Height: =20
            Size: =8.5
            Color: =RGBA(220, 230, 250, 1)
            Font: =T.font
      - btnMeOut:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="🔒 ออกจากระบบ"
            X: =Parent.Width - 254
            Y: =14
            Width: =120
            Height: =36
            OnSelect: |-
              =Set(varMyCode, Blank()); Set(varMeEmp, Blank());
              If(varRole = "Kiosk" || IsBlank(varRole), Navigate(scrSignIn), Navigate(scrHome))
            Fill: =RGBA(255, 255, 255, 0.12)
            Color: =Color.White
            HoverFill: =ColorFade(RGBA(255, 255, 255, 0.12), -10%)
            HoverColor: =Color.White
            BorderThickness: =1
            BorderColor: =RGBA(255, 255, 255, 0.5)
            Font: =T.font
            Size: =9
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =9
            RadiusTopRight: =9
            RadiusBottomLeft: =9
            RadiusBottomRight: =9
      - btnMeBack:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="← เมนู"
            X: =Parent.Width - 112
            Y: =14
            Width: =100
            Height: =36
            OnSelect: =Navigate(scrHome)
            Visible: =varRole <> "Kiosk"
            Fill: =RGBA(255, 255, 255, 0.12)
            Color: =Color.White
            HoverFill: =ColorFade(RGBA(255, 255, 255, 0.12), -10%)
            HoverColor: =Color.White
            BorderThickness: =1
            BorderColor: =RGBA(255, 255, 255, 0.5)
            Font: =T.font
            Size: =10
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =9
            RadiusTopRight: =9
            RadiusBottomLeft: =9
            RadiusBottomRight: =9
      - lblMeWarn:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =With({n: CountRows(Filter(colMe, !acknowledged))}, If(n > 0, "⚠ ยังไม่รับทราบ " & n & " งาน — กดรับทราบก่อนเริ่มงาน", "รับทราบครบแล้ว ✓"))
            X: =16
            Y: =76
            Width: =Parent.Width - 32
            Height: =36
            Align: =Align.Center
            Size: =11
            Color: =If(CountRows(Filter(colMe, !acknowledged)) > 0, T.bad, T.ok)
            Fill: =If(CountRows(Filter(colMe, !acknowledged)) > 0, T.badSoft, T.okSoft)
            Font: =T.font
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =9
            RadiusTopRight: =9
            RadiusBottomLeft: =9
            RadiusBottomRight: =9
      - lblMeEmpty:
          Control: Label@2.5.1
          Properties:
            Text: ="— วันนี้ยังไม่มีงานที่ลงให้คุณ —"
            X: =16
            Y: =130
            Width: =Parent.Width - 32
            Height: =40
            Align: =Align.Center
            Size: =11
            Color: =T.ink2
            Font: =T.font
            Visible: =CountRows(colMe) = 0
      - galMe:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: =SortByColumns(colMe, "sta")
            X: =16
            Y: =120
            Width: =Parent.Width - 32
            Height: =Parent.Height - 132
            TemplateSize: =76
            TemplatePadding: =6
            TemplateFill: =RGBA(0, 0, 0, 0)
          Children:
            - recMeCard:
                Control: Rectangle@2.3.0
                Properties:
                  X: =2
                  Y: =2
                  Width: =Parent.TemplateWidth - 4
                  Height: =Parent.TemplateHeight - 6
                  Fill: =Switch(ThisItem.priority.Value, "WHEELCHAIR", T.warnSoft, "SUPPORT", T.skySoft, Color.White)
                  BorderColor: =T.line
                  BorderThickness: =1
            - lblMeFlt:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Title & "  ·  " & Coalesce(ThisItem.task, "") & "   " & ThisItem.sta & "–" & ThisItem.std
                  X: =16
                  Y: =8
                  Width: =Parent.TemplateWidth - 180
                  Height: =56
                  Size: =12
                  Color: =T.ink
                  Font: =T.font
                  FontWeight: =FontWeight.Semibold
            - btnMeAck:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =If(ThisItem.acknowledged, "✓ รับทราบแล้ว", "กดรับทราบ")
                  X: =Parent.TemplateWidth - 160
                  Y: =16
                  Width: =148
                  Height: =42
                  OnSelect: |-
                    =With({u: Patch(PAS_Assignment, ThisItem, { acknowledged: true, ack_at: Now(), ack_by: varMyCode })},
                       Remove(colMe, ThisItem); Collect(colMe, u));
                     Notify("รับทราบงาน " & ThisItem.Title & " แล้ว", NotificationType.Success)
                  DisplayMode: =If(ThisItem.acknowledged, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =If(ThisItem.acknowledged, T.okSoft, T.brand)
                  Color: =If(ThisItem.acknowledged, T.ok, Color.White)
                  HoverFill: =ColorFade(If(ThisItem.acknowledged, T.okSoft, T.brand), -10%)
                  HoverColor: =If(ThisItem.acknowledged, T.ok, Color.White)
                  BorderThickness: =0
                  Font: =T.font
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  RadiusTopLeft: =9
                  RadiusTopRight: =9
                  RadiusBottomLeft: =9
                  RadiusBottomRight: =9
