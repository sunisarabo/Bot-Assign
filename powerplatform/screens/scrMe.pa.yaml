Screens:
  scrMe:
    Properties:
      Fill: =T.bg
      OnVisible: |-
        =Set(varMyKey, Text(Today(), "yyyy-mm-dd"));
        If(IsBlank(varMyCode) && !IsBlank(varMe.emp_code), Set(varMyCode, varMe.emp_code));
        Set(varMeEmp, LookUp(PAS_Employees, emp_code = varMyCode));
        If(IsBlank(varMeTab), Set(varMeTab, "flight"));
        ClearCollect(colMe, Filter(PAS_Assignment, day_key = varMyKey, emp_code = varMyCode));
        ClearCollect(colMeWC, AddColumns(Filter(pas_wc_caseporter, Staff.StaffId = varMyCode, DateValue(AssignedAt) = Today()), "case", LookUp(pas_wc_case, CaseId = Case.CaseId)))
    Children:
      - recMeTop:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =64
            Fill: =T.brand
      - lblMeTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="📋 งานของฉันวันนี้"
            X: =16
            Y: =6
            Width: =Parent.Width - 300
            Height: =30
            Size: =If(Parent.Width < 760, 14, 17)
            Color: =Color.White
            Font: =T.font
            FontWeight: =FontWeight.Bold
      - lblMeWho:
          Control: Label@2.5.1
          Properties:
            Text: =Coalesce(varMeEmp.name_th, varMeEmp.name_en, varMyCode) & "  ·  " & Text(Today(), "d mmm yyyy")
            X: =16
            Y: =36
            Width: =Parent.Width - 300
            Height: =20
            Size: =8.5
            Color: =RGBA(220, 230, 250, 1)
            Font: =T.font
      - btnMeOut:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="🔒 ออก"
            X: =Parent.Width - 200
            Y: =14
            Width: =84
            Height: =36
            OnSelect: |-
              =Set(varMyCode, Blank()); Set(varMeEmp, Blank());
              If(varRole = "Kiosk" || IsBlank(varRole), Navigate(scrSignIn), Navigate(scrHome))
            Fill: =RGBA(255, 255, 255, 0.12)
            Color: =Color.White
            HoverFill: =ColorFade(RGBA(255, 255, 255, 0.12), -10%)
            HoverColor: =Color.White
            BorderThickness: =1
            BorderColor: =RGBA(255, 255, 255, 0.5)
            Font: =T.font
            Size: =9
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =9
            RadiusTopRight: =9
            RadiusBottomLeft: =9
            RadiusBottomRight: =9
      - btnMeBack:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="← เมนู"
            X: =Parent.Width - 108
            Y: =14
            Width: =96
            Height: =36
            OnSelect: =Navigate(scrHome)
            Visible: =varRole <> "Kiosk"
            Fill: =RGBA(255, 255, 255, 0.12)
            Color: =Color.White
            HoverFill: =ColorFade(RGBA(255, 255, 255, 0.12), -10%)
            HoverColor: =Color.White
            BorderThickness: =1
            BorderColor: =RGBA(255, 255, 255, 0.5)
            Font: =T.font
            Size: =10
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =9
            RadiusTopRight: =9
            RadiusBottomLeft: =9
            RadiusBottomRight: =9
      - btnMeTabF:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="งานไฟลท์ (" & CountRows(colMe) & ")"
            X: =16
            Y: =74
            Width: =170
            Height: =36
            OnSelect: =Set(varMeTab, "flight")
            Fill: =If(varMeTab = "flight", T.brand, T.surface2)
            Color: =If(varMeTab = "flight", Color.White, T.ink2)
            HoverFill: =ColorFade(If(varMeTab = "flight", T.brand, T.surface2), -10%)
            HoverColor: =If(varMeTab = "flight", Color.White, T.ink2)
            BorderThickness: =0
            Font: =T.font
            Size: =10
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =18
            RadiusTopRight: =18
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
      - btnMeTabWC:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="♿ งานวีลแชร์ (" & CountRows(Filter(colMeWC, case.Status.Value in ["STANDBY", "ASSIGNED", "ON_PROCESS"])) & ")"
            X: =194
            Y: =74
            Width: =190
            Height: =36
            OnSelect: =Set(varMeTab, "wc")
            Fill: =If(varMeTab = "wc", T.ok, T.surface2)
            Color: =If(varMeTab = "wc", Color.White, T.ink2)
            HoverFill: =ColorFade(If(varMeTab = "wc", T.ok, T.surface2), -10%)
            HoverColor: =If(varMeTab = "wc", Color.White, T.ink2)
            BorderThickness: =0
            Font: =T.font
            Size: =10
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =18
            RadiusTopRight: =18
            RadiusBottomLeft: =18
            RadiusBottomRight: =18
      - lblMeWarn:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =With({n: CountRows(Filter(colMe, !acknowledged)) + CountRows(Filter(colMeWC, case.pas_acknowledged <> true, case.Status.Value in ["STANDBY", "ASSIGNED", "ON_PROCESS"]))},
                 If(n > 0, "⚠ ยังไม่รับทราบ " & n & " งาน — กดรับทราบก่อนเริ่มงาน", "รับทราบครบแล้ว ✓"))
            X: =392
            Y: =74
            Width: =Parent.Width - 408
            Height: =36
            Align: =Align.Center
            Size: =10
            Color: =If(CountRows(Filter(colMe, !acknowledged)) + CountRows(Filter(colMeWC, case.pas_acknowledged <> true, case.Status.Value in ["STANDBY", "ASSIGNED", "ON_PROCESS"])) > 0, T.bad, T.ok)
            Fill: =If(CountRows(Filter(colMe, !acknowledged)) + CountRows(Filter(colMeWC, case.pas_acknowledged <> true, case.Status.Value in ["STANDBY", "ASSIGNED", "ON_PROCESS"])) > 0, T.badSoft, T.okSoft)
            Font: =T.font
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =9
            RadiusTopRight: =9
            RadiusBottomLeft: =9
            RadiusBottomRight: =9
      - galMe:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Visible: =varMeTab = "flight"
            Items: =SortByColumns(colMe, "sta")
            X: =16
            Y: =118
            Width: =Parent.Width - 32
            Height: =Parent.Height - 130
            TemplateSize: =76
            TemplatePadding: =6
            TemplateFill: =RGBA(0, 0, 0, 0)
          Children:
            - recMeCard:
                Control: Rectangle@2.3.0
                Properties:
                  X: =2
                  Y: =2
                  Width: =Parent.TemplateWidth - 4
                  Height: =Parent.TemplateHeight - 6
                  Fill: =Switch(ThisItem.priority, "WHEELCHAIR", T.warnSoft, "SUPPORT", T.skySoft, Color.White)
                  BorderColor: =T.line
                  BorderThickness: =1
            - lblMeFlt:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Title & "  ·  " & Coalesce(ThisItem.task, "") & "   " & ThisItem.sta & "–" & ThisItem.std
                  X: =16
                  Y: =8
                  Width: =Parent.TemplateWidth - 180
                  Height: =56
                  Size: =12
                  Color: =T.ink
                  Font: =T.font
                  FontWeight: =FontWeight.Semibold
            - btnMeAck:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =If(ThisItem.acknowledged, "✓ รับทราบแล้ว", "กดรับทราบ")
                  X: =Parent.TemplateWidth - 160
                  Y: =16
                  Width: =148
                  Height: =42
                  OnSelect: |-
                    =With({u: Patch(PAS_Assignment, ThisItem, { acknowledged: true, ack_at: Now() })},
                       Remove(colMe, ThisItem); Collect(colMe, u));
                     Notify("รับทราบงาน " & ThisItem.Title & " แล้ว", NotificationType.Success)
                  DisplayMode: =If(ThisItem.acknowledged, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =If(ThisItem.acknowledged, T.okSoft, T.brand)
                  Color: =If(ThisItem.acknowledged, T.ok, Color.White)
                  BorderThickness: =0
                  Font: =T.font
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  RadiusTopLeft: =9
                  RadiusTopRight: =9
                  RadiusBottomLeft: =9
                  RadiusBottomRight: =9
      - galMeWC:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Visible: =varMeTab = "wc"
            Items: =SortByColumns(Filter(colMeWC, case.Status.Value in ["STANDBY", "ASSIGNED", "ON_PROCESS"]), "AssignedAt")
            X: =16
            Y: =118
            Width: =Parent.Width - 32
            Height: =Parent.Height - 130
            TemplateSize: =92
            TemplatePadding: =6
            TemplateFill: =RGBA(0, 0, 0, 0)
          Children:
            - recMWCard:
                Control: Rectangle@2.3.0
                Properties:
                  X: =2
                  Y: =2
                  Width: =Parent.TemplateWidth - 4
                  Height: =Parent.TemplateHeight - 6
                  Fill: =If(ThisItem.case.pas_acknowledged, T.okSoft, T.warnSoft)
                  BorderColor: =T.line
                  BorderThickness: =1
            - lblMWInfo:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    ="🦽 " & ThisItem.case.FlightNo & " · เกท " & Coalesce(ThisItem.case.Gate, "-") & " · " & ThisItem.case.Status.Value & If(!IsBlank(ThisItem.case.pas_assigned_wc), Char(10) & "รถเข็น " & ThisItem.case.pas_assigned_wc, "")
                  X: =16
                  Y: =10
                  Width: =Parent.TemplateWidth - 180
                  Height: =68
                  Size: =12
                  Color: =T.ink
                  Font: =T.font
                  FontWeight: =FontWeight.Semibold
            - btnMWAck:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =If(ThisItem.case.pas_acknowledged, "✓ รับแล้ว", "รับเคส/รับทราบ")
                  X: =Parent.TemplateWidth - 168
                  Y: =22
                  Width: =156
                  Height: =48
                  OnSelect: |-
                    =With({ c: ThisItem.case, w: LookUp(pas_wheelchair, ControlNo = ThisItem.case.pas_assigned_wc) },
                       Patch(pas_wc_case, c, { pas_acknowledged: true, pas_ack_at: Now(), pas_ack_by: varMyCode });
                       If(!IsBlank(c.pas_assigned_wc),
                          Patch(pas_wc_trip, Defaults(pas_wc_trip), { TripDate: Today(), Wheelchair: w, Staff: LookUp(pas_wc_staff, StaffId = varMyCode), FlightCode: c.FlightNo, StartTime: Now(), TripStatus: { Value: "กำลังบริการ" }, Case: c });
                          Patch(pas_wc_case, c, { Status: { Value: "ON_PROCESS" }, PickupTime: Coalesce(c.PickupTime, Text(Now(), "hh:mm")) }));
                       Notify("รับทราบเคส " & c.FlightNo, NotificationType.Success); Select(btnMeTabWC))
                  DisplayMode: =If(ThisItem.case.pas_acknowledged, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =If(ThisItem.case.pas_acknowledged, T.okSoft, T.ok)
                  Color: =If(ThisItem.case.pas_acknowledged, T.ok, Color.White)
                  BorderThickness: =0
                  Font: =T.font
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  RadiusTopLeft: =9
                  RadiusTopRight: =9
                  RadiusBottomLeft: =9
                  RadiusBottomRight: =9
      - lblMeEmpty:
          Control: Label@2.5.1
          Properties:
            Text: =If(varMeTab = "flight", "— วันนี้ยังไม่มีงานไฟลท์ของคุณ —", "— ยังไม่มีเคสวีลแชร์ของคุณ —")
            X: =16
            Y: =130
            Width: =Parent.Width - 32
            Height: =40
            Align: =Align.Center
            Size: =11
            Color: =T.ink2
            Font: =T.font
            Visible: =If(varMeTab = "flight", CountRows(colMe) = 0, CountRows(Filter(colMeWC, case.Status.Value in ["STANDBY", "ASSIGNED", "ON_PROCESS"])) = 0)
