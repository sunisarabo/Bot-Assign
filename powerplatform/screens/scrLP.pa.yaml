Screens:
  scrLP:
    Properties:
      Fill: =T.bg
      OnVisible: |-
        =If(IsBlank(varLPMode), Set(varLPMode, "lp"));
        If(varLPMode = "lp" && !varPriv, Notify("หน้าจ่ายงานสำหรับ LP/หัวหน้า", NotificationType.Error); Navigate(scrHome));
        Set(varWDate, Today());
        Concurrent(
          ClearCollect(colCases, Filter(pas_wc_case, CaseDate = varWDate)),
          ClearCollect(colQ, Filter(pas_wc_queue, QueueDate = varWDate)),
          ClearCollect(colTripAct, Filter(pas_wc_trip, TripDate = varWDate, IsBlank(EndTime))),
          ClearCollect(colWC, Filter(pas_wheelchair, IsActive = true))
        );
        ClearCollect(colQueue, SortByColumns(colQ, "TripsToday", SortOrder.Ascending, "SortOrder", SortOrder.Ascending));
        ClearCollect(colWCFree, Filter(colWC, IsBlank(LookUp(colTripAct, Wheelchair.ControlNo = ControlNo && DateDiff(StartTime, Now(), TimeUnit.Hours) < 12))));
        Set(varNextP, First(Filter(colQueue, State.Value = "ว่าง")));
        If(varLPMode = "porter",
          ClearCollect(colMyWC, AddColumns(Filter(pas_wc_caseporter, Staff.StaffId = varMyCode, DateValue(AssignedAt) = Today()), "case", LookUp(pas_wc_case, CaseId = Case.CaseId))))
    Children:
      - recLPTop:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =64
            Fill: =If(varLPMode = "porter", T.ok, T.brand)
      - lblLPTitle:
          Control: Label@2.5.1
          Properties:
            Text: =If(varLPMode = "porter", "♿ งานพอตเตอร์ของฉัน", "♿ LP จ่ายงาน Porter")
            X: =16
            Y: =6
            Width: =Parent.Width - 280
            Height: =30
            Size: =If(Parent.Width < 760, 14, 17)
            Color: =Color.White
            Font: =T.font
            FontWeight: =FontWeight.Bold
      - lblLPSub:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =If(varLPMode = "porter", Coalesce(LookUp(PAS_Employees, emp_code = varMyCode).name_th, varMyCode) & " · กดรับเคสก่อนเริ่มงาน", "เคสรอจ่าย " & CountRows(Filter(colCases, Status.Value = "STANDBY")) & " · กำลังบริการ " & CountRows(colTripAct) & " · รถเข็นว่าง " & CountRows(colWCFree) & " · ถัดไป: " & Coalesce(varNextP.Staff.NickTh, "-"))
            X: =16
            Y: =36
            Width: =Parent.Width - 280
            Height: =20
            Size: =8.5
            Color: =RGBA(230, 240, 235, 1)
            Font: =T.font
      - btnLPOut:
          Control: Classic/Button@2.2.0
          Properties:
            Text: =If(varLPMode = "porter", "🔒 ออก", "← เมนู")
            X: =Parent.Width - 112
            Y: =14
            Width: =100
            Height: =36
            OnSelect: |-
              =If(varLPMode = "porter", Set(varMyCode, Blank()); Set(varLPMode, Blank()); Navigate(scrSignIn), Navigate(scrHome))
            Fill: =RGBA(255, 255, 255, 0.14)
            Color: =Color.White
            HoverFill: =ColorFade(RGBA(255, 255, 255, 0.14), -10%)
            HoverColor: =Color.White
            BorderThickness: =1
            BorderColor: =RGBA(255, 255, 255, 0.5)
            Font: =T.font
            Size: =10
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =9
            RadiusTopRight: =9
            RadiusBottomLeft: =9
            RadiusBottomRight: =9
      - galMyWC:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Visible: =varLPMode = "porter"
            Items: =SortByColumns(Filter(colMyWC, case.Status.Value in ["STANDBY", "ASSIGNED", "ON_PROCESS"]), "AssignedAt")
            X: =16
            Y: =76
            Width: =Parent.Width - 32
            Height: =Parent.Height - 88
            TemplateSize: =92
            TemplatePadding: =6
            TemplateFill: =RGBA(0, 0, 0, 0)
          Children:
            - recMWCard:
                Control: Rectangle@2.3.0
                Properties:
                  X: =2
                  Y: =2
                  Width: =Parent.TemplateWidth - 4
                  Height: =Parent.TemplateHeight - 6
                  Fill: =If(ThisItem.case.pas_acknowledged, T.okSoft, T.warnSoft)
                  BorderColor: =T.line
                  BorderThickness: =1
            - lblMWInfo:
                Control: Label@2.5.1
                Properties:
                  Text: |-
                    ="🦽 " & ThisItem.case.FlightNo & " · เกท " & Coalesce(ThisItem.case.Gate, "-") & " · " & ThisItem.case.Status.Value & If(!IsBlank(ThisItem.case.pas_assigned_wc), Char(10) & "รถเข็น " & ThisItem.case.pas_assigned_wc, "")
                  X: =16
                  Y: =10
                  Width: =Parent.TemplateWidth - 180
                  Height: =68
                  Size: =12
                  Color: =T.ink
                  Font: =T.font
                  FontWeight: =FontWeight.Semibold
            - btnMWAck:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =If(ThisItem.case.pas_acknowledged, "✓ รับแล้ว", "รับเคส/รับทราบ")
                  X: =Parent.TemplateWidth - 168
                  Y: =22
                  Width: =156
                  Height: =48
                  OnSelect: |-
                    =With({ c: ThisItem.case, w: LookUp(pas_wheelchair, ControlNo = ThisItem.case.pas_assigned_wc) },
                       Patch(pas_wc_case, c, { pas_acknowledged: true, pas_ack_at: Now(), pas_ack_by: varMyCode });
                       If(!IsBlank(c.pas_assigned_wc),
                          Patch(pas_wc_trip, Defaults(pas_wc_trip), { TripDate: Today(), Wheelchair: w, Staff: LookUp(pas_wc_staff, StaffId = varMyCode), FlightCode: c.FlightNo, StartTime: Now(), TripStatus: { Value: "กำลังบริการ" }, Case: c });
                          Patch(pas_wc_case, c, { Status: { Value: "ON_PROCESS" }, PickupTime: Coalesce(c.PickupTime, Text(Now(), "hh:mm")) }));
                       Notify("รับทราบเคส " & c.FlightNo, NotificationType.Success); Select(btnLPOut))
                  DisplayMode: =If(ThisItem.case.pas_acknowledged, DisplayMode.Disabled, DisplayMode.Edit)
                  Fill: =If(ThisItem.case.pas_acknowledged, T.okSoft, T.ok)
                  Color: =If(ThisItem.case.pas_acknowledged, T.ok, Color.White)
                  BorderThickness: =0
                  Font: =T.font
                  Size: =11
                  FontWeight: =FontWeight.Semibold
                  RadiusTopLeft: =9
                  RadiusTopRight: =9
                  RadiusBottomLeft: =9
                  RadiusBottomRight: =9
      - galLPQueue:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Visible: =varLPMode = "lp"
            Items: =colQueue
            X: =16
            Y: =76
            Width: =If(Parent.Width < 760, Parent.Width - 32, 320)
            Height: =Parent.Height - 88
            TemplateSize: =40
            TemplatePadding: =0
            TemplateFill: =Color.White
          Children:
            - lblQName:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Staff.NickTh & "  ·  " & ThisItem.State.Value & " (" & Coalesce(ThisItem.TripsToday, 0) & ")"
                  X: =10
                  Y: =2
                  Width: =Parent.TemplateWidth - 20
                  Height: =36
                  Size: =10
                  Color: =T.ink
                  Fill: =If(ThisItem.Staff.StaffId = varNextP.Staff.StaffId, T.okSoft, Color.White)
                  Font: =T.font
      - galLPCases:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Visible: =varLPMode = "lp"
            Items: =SortByColumns(Filter(colCases, Status.Value = "STANDBY"), "NotifiedTime")
            X: =If(Parent.Width < 760, 16, 348)
            Y: =76
            Width: =If(Parent.Width < 760, Parent.Width - 32, Parent.Width - 364)
            Height: =Parent.Height - 148
            TemplateSize: =46
            TemplatePadding: =2
            TemplateFill: =Color.White
          Children:
            - lblCaseInfo:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.FlightNo & " · เกท " & Coalesce(ThisItem.Gate, "-") & " · " & Coalesce(ThisItem.ServiceType.Value, "")
                  X: =12
                  Y: =2
                  Width: =Parent.TemplateWidth - 110
                  Height: =42
                  Size: =11
                  Color: =T.ink
                  Font: =T.font
            - btnCasePick:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =If(varLPCase.CaseId = ThisItem.CaseId, "✓ เลือก", "เลือก")
                  X: =Parent.TemplateWidth - 96
                  Y: =6
                  Width: =84
                  Height: =34
                  OnSelect: =Set(varLPCase, ThisItem)
                  Fill: =If(varLPCase.CaseId = ThisItem.CaseId, T.ok, Color.White)
                  Color: =If(varLPCase.CaseId = ThisItem.CaseId, Color.White, T.ok)
                  BorderThickness: =1
                  BorderColor: =T.ok
                  Font: =T.font
                  Size: =10
                  FontWeight: =FontWeight.Semibold
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
      - ddLPPorter:
          Control: Classic/DropDown@2.3.1
          Properties:
            Visible: =varLPMode = "lp"
            Items: =Filter(colQueue, State.Value = "ว่าง")
            X: =If(Parent.Width < 760, 16, 348)
            Y: =Parent.Height - 64
            Width: =200
            Height: =44
            BorderColor: =T.line
            Fill: =T.surface
            Color: =T.ink
            Font: =T.font
            Size: =10
      - ddLPWC:
          Control: Classic/DropDown@2.3.1
          Properties:
            Visible: =varLPMode = "lp"
            Items: =colWCFree
            X: =If(Parent.Width < 760, 224, 556)
            Y: =Parent.Height - 64
            Width: =150
            Height: =44
            BorderColor: =T.line
            Fill: =T.surface
            Color: =T.ink
            Font: =T.font
            Size: =10
      - btnLPAssign:
          Control: Classic/Button@2.2.0
          Properties:
            Visible: =varLPMode = "lp"
            Text: ="มอบหมาย (รอรับทราบ)"
            X: =If(Parent.Width < 760, 384, 716)
            Y: =Parent.Height - 64
            Width: =Parent.Width - If(Parent.Width < 760, 400, 732)
            Height: =44
            OnSelect: |-
              =With({ c: varLPCase, p: Coalesce(ddLPPorter.Selected, varNextP), w: ddLPWC.Selected },
                If(IsBlank(c) || IsBlank(p) || IsBlank(w), Notify("เลือกเคส + พอตเตอร์ + รถเข็น", NotificationType.Warning),
                   c.Status.Value in ["COMPLETED", "CANCELLED"], Notify("เคสจบ/ยกเลิกแล้ว", NotificationType.Error),
                   !IsBlank(LookUp(colTripAct, Wheelchair.ControlNo = w.ControlNo)), Notify("รถเข็น " & w.ShortNo & " กำลังใช้งาน", NotificationType.Error),
                   Patch(pas_wc_caseporter, Defaults(pas_wc_caseporter), { Case: c, Staff: p.Staff, AssignedAt: Now(), AssignedBy: User().Email });
                   Patch(pas_wc_case, c, { Status: { Value: "ASSIGNED" }, pas_acknowledged: false, pas_assigned_wc: w.ControlNo });
                   Patch(pas_wc_queue, LookUp(colQ, Staff.StaffId = p.Staff.StaffId), { State: { Value: "รอรับทราบ" }, SortOrder: Max(colQ, SortOrder) + 1, UpdatedAt: Now() });
                   Notify("มอบหมาย " & c.FlightNo & " → " & p.Staff.NickTh & " · รอพอตเตอร์รับทราบ", NotificationType.Success);
                   Set(varLPCase, Blank()); Navigate(scrLP)))
            Fill: =T.brand
            Color: =Color.White
            HoverFill: =ColorFade(T.brand, -10%)
            HoverColor: =Color.White
            BorderThickness: =0
            Font: =T.font
            Size: =11
            FontWeight: =FontWeight.Semibold
            RadiusTopLeft: =9
            RadiusTopRight: =9
            RadiusBottomLeft: =9
            RadiusBottomRight: =9
