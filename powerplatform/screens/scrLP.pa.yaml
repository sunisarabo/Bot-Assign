Screens:
  scrLP:
    Properties:
      Fill: =RGBA(244, 246, 248, 1)
      OnVisible: |-
        =If(!varPriv, Notify("หน้านี้สำหรับ LP/หัวหน้า (EDITOR/ADMIN)", NotificationType.Error); Navigate(scrHome));
        Select(btnLPLoad)
    Children:
      - recLPHead:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(45, 106, 79, 1)
            Height: =64
            Width: =Parent.Width
      - lblLPTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="♿ LP จ่ายงาน Porter"
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Size: =18
            X: =20
            Y: =12
            Width: =Parent.Width - 300
            Height: =40
      - btnLPBack:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="← กลับเมนู"
            OnSelect: =Navigate(scrHome)
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(45, 106, 79, 1)
            X: =Parent.Width - 130
            Y: =14
            Width: =110
            Height: =36
      - btnLPLoad:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="โหลดวันนี้"
            Fill: =RGBA(45, 106, 79, 1)
            Color: =RGBA(255, 255, 255, 1)
            X: =20
            Y: =76
            Width: =120
            Height: =34
            OnSelect: |-
              =Set(varWDate, Today());
              Concurrent(
                ClearCollect(colCases, Filter(pas_wc_cases, CaseDate = varWDate)),
                ClearCollect(colQ, Filter(pas_wc_queues, QueueDate = varWDate)),
                ClearCollect(colTripAct, Filter(pas_wc_trips, TripDate = varWDate, IsBlank(EndTime))),
                ClearCollect(colWC, Filter(pas_wheelchairs, IsActive = true))
              );
              ClearCollect(colQueue, SortByColumns(colQ, "TripsToday", SortOrder.Ascending, "SortOrder", SortOrder.Ascending));
              ClearCollect(colWCFree, Filter(colWC, IsBlank(LookUp(colTripAct, Wheelchair.ControlNo = ControlNo && DateDiff(StartTime, Now(), TimeUnit.Hours) < 12))));
              Set(varNextP, First(Filter(colQueue, State.Value = "ว่าง")))
      - btnLPBuild:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="สร้างเคสจาก Pre-WC"
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(45, 106, 79, 1)
            BorderColor: =RGBA(45, 106, 79, 1)
            DisplayMode: =If(varPriv, DisplayMode.Edit, DisplayMode.Disabled)
            X: =148
            Y: =76
            Width: =170
            Height: =34
            OnSelect: |-
              =IfError('WC Build Cases'.Run(Text(varWDate, "yyyy-mm-dd")),
                 Notify("ยังไม่ได้ผูก flow 'WC Build Cases' (ดู wc-08)", NotificationType.Warning));
               Notify("สร้าง/อัปเดตเคสจาก Pre-WC วันนี้แล้ว", NotificationType.Success); Select(btnLPLoad)
      - lblLPSum:
          Control: Label@2.5.1
          Properties:
            Text: |-
              ="เคสรอจ่าย " & CountRows(Filter(colCases, Status.Value = "STANDBY")) & " · กำลังบริการ " & CountRows(colTripAct) & " · รถเข็นว่าง " & CountRows(colWCFree) & " · คิวถัดไป: " & Coalesce(varNextP.Staff.NickTh, "-")
            Size: =12
            X: =328
            Y: =80
            Width: =Parent.Width - 348
            Height: =30
      - lblLPQueueH:
          Control: Label@2.5.1
          Properties:
            Text: ="คิวพอตเตอร์ (เคสน้อยสุดก่อน)"
            FontWeight: =FontWeight.Semibold
            Size: =12
            X: =20
            Y: =118
            Width: =360
            Height: =24
      - galLPQueue:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: =colQueue
            TemplateSize: =40
            X: =20
            Y: =146
            Width: =360
            Height: =Parent.Height - 160
            TemplateFill: =RGBA(255, 255, 255, 1)
          Children:
            - lblQName:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.Staff.NickTh
                  Fill: =If(ThisItem.Staff.StaffId = varNextP.Staff.StaffId, RGBA(226, 239, 218, 1), RGBA(255, 255, 255, 1))
                  Size: =12
                  X: =8
                  Y: =2
                  Width: =210
                  Height: =36
            - lblQState:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.State.Value & " · " & Coalesce(ThisItem.TripsToday, 0)
                  Size: =11
                  Color: =RGBA(100, 100, 100, 1)
                  X: =220
                  Y: =2
                  Width: =130
                  Height: =36
      - lblLPCasesH:
          Control: Label@2.5.1
          Properties:
            Text: ="เคสรอจ่าย → เลือกเคส + พอตเตอร์ + รถเข็น"
            FontWeight: =FontWeight.Semibold
            Size: =12
            X: =396
            Y: =118
            Width: =Parent.Width - 416
            Height: =24
      - galLPCases:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: =SortByColumns(Filter(colCases, Status.Value = "STANDBY"), "NotifiedTime")
            TemplateSize: =44
            X: =396
            Y: =146
            Width: =Parent.Width - 416
            Height: =Parent.Height - 300
            TemplateFill: =RGBA(255, 255, 255, 1)
          Children:
            - lblCaseInfo:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.FlightNo & " · เกท " & Coalesce(ThisItem.Gate, "-") & " · " & Coalesce(ThisItem.Service, "")
                  Size: =12
                  X: =10
                  Y: =2
                  Width: =Parent.TemplateWidth - 20
                  Height: =40
            - btnCasePick:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =If(varLPCase.CaseId = ThisItem.CaseId, "✓ เลือก", "เลือก")
                  Fill: =If(varLPCase.CaseId = ThisItem.CaseId, RGBA(45, 106, 79, 1), RGBA(255, 255, 255, 1))
                  Color: =If(varLPCase.CaseId = ThisItem.CaseId, RGBA(255, 255, 255, 1), RGBA(45, 106, 79, 1))
                  X: =Parent.TemplateWidth - 90
                  Y: =6
                  Width: =80
                  Height: =32
                  OnSelect: =Set(varLPCase, ThisItem)
      - ddLPPorter:
          Control: Classic/DropDown@2.3.1
          Properties:
            Items: =Filter(colQueue, State.Value = "ว่าง")
            X: =396
            Y: =Parent.Height - 146
            Width: =200
            Height: =36
      - ddLPWC:
          Control: Classic/DropDown@2.3.1
          Properties:
            Items: =colWCFree
            X: =606
            Y: =Parent.Height - 146
            Width: =160
            Height: =36
      - btnLPAssign:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="มอบหมาย (รอพอตเตอร์รับทราบ)"
            Fill: =RGBA(45, 106, 79, 1)
            Color: =RGBA(255, 255, 255, 1)
            X: =776
            Y: =Parent.Height - 146
            Width: =Parent.Width - 796
            Height: =36
            OnSelect: |-
              =With({ c: varLPCase, p: Coalesce(ddLPPorter.Selected, varNextP), w: ddLPWC.Selected },
                If(IsBlank(c) || IsBlank(p) || IsBlank(w), Notify("เลือกเคส + พอตเตอร์ + รถเข็น", NotificationType.Warning),
                   c.Status.Value in ["COMPLETED", "CANCELLED"], Notify("เคสจบ/ยกเลิกแล้ว", NotificationType.Error),
                   !IsBlank(LookUp(colTripAct, Wheelchair.ControlNo = w.ControlNo)), Notify("รถเข็น " & w.ShortNo & " กำลังใช้งาน", NotificationType.Error),
                   Patch(pas_wc_caseporters, Defaults(pas_wc_caseporters), { Case: c, Staff: p.Staff, AssignedAt: Now(), AssignedBy: User().Email });
                   Patch(pas_wc_cases, c, { Status: { Value: "ASSIGNED" }, pas_acknowledged: false, pas_assigned_wc: w.ControlNo });
                   Patch(pas_wc_queues, LookUp(colQ, Staff.StaffId = p.Staff.StaffId), { State: { Value: "รอรับทราบ" }, SortOrder: Max(colQ, SortOrder) + 1, UpdatedAt: Now() });
                   Notify("มอบหมาย " & c.FlightNo & " → " & p.Staff.NickTh & " (" & w.ShortNo & ") · รอพอตเตอร์รับทราบที่งานของฉัน", NotificationType.Success);
                   Set(varLPCase, Blank()); Select(btnLPLoad)))
      - btnLPStale:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="ปิดงานค้าง >12 ชม."
            Fill: =RGBA(168, 99, 0, 1)
            Color: =RGBA(255, 255, 255, 1)
            Visible: =varPriv
            X: =20
            Y: =Parent.Height - 50
            Width: =200
            Height: =34
            OnSelect: |-
              =ForAll(Filter(colTripAct, DateDiff(StartTime, Now(), TimeUnit.Hours) >= 12) As t,
                 Patch(pas_wc_trips, t, { TripStatus: { Value: "ค้าง — ไม่ได้กดจบ" } }));
               Notify("ปิดงานค้างแล้ว · รถเข็นปลดล็อก", NotificationType.Information); Select(btnLPLoad)
