Screens:
  scrHome:
    Properties:
      Fill: =Theme.Bg
      OnVisible: |-
        =If(IsBlank(varRole), Set(varMe, LookUp(PAS_Users, Title = Lower(User().Email))); Set(varRole, If(IsBlank(varMe) || !varMe.active, "Viewer", varMe.role.Value)));
        Set(varPriv, !(varRole in ["Viewer", "Staff", "Employee"]));
        Set(varAdmin, varRole = "Admin");
        Set(varMyCode, Coalesce(varMe.emp_code, varMyCode, ""));
        ClearCollect(colHMenu,
          { key: "day",     title: "แดชบอร์ดรายวัน",    sub: "Dashboard · SLA · Util",       icon: "📊", needEdit: false, needAdmin: false, accent: Theme.Navy },
          { key: "my",      title: "งานของฉันวันนี้",   sub: "ดูงาน + กดรับทราบ",            icon: "📋", needEdit: false, needAdmin: false, accent: Theme.Navy },
          { key: "roster",  title: "ตารางเวร (Roster)", sub: "คน × วัน · แลกเวร/ลา/เปลี่ยนกะ", icon: "🗓", needEdit: false, needAdmin: false, accent: Theme.Navy },
          { key: "assign",  title: "มอบหมายงาน (Assign)", sub: "ลงตำแหน่งต่อไฟลท์",           icon: "🧭", needEdit: false, needAdmin: false, accent: Theme.Green },
          { key: "flights", title: "ไฟลท์",             sub: "เพิ่ม/แก้/ยกเลิก",              icon: "✈", needEdit: true,  needAdmin: false, accent: Theme.Amber },
          { key: "wh",      title: "ชม.ทำงาน/OT",        sub: "รายสัปดาห์ · cap 48/36",       icon: "⏱", needEdit: false, needAdmin: false, accent: Theme.Purple },
          { key: "ot",      title: "ตรวจ OT",            sub: "OT ขอจริง",                    icon: "💰", needEdit: false, needAdmin: false, accent: Theme.Red },
          { key: "lpp",     title: "LP จ่ายงาน Porter",  sub: "จ่ายงาน · พอตเตอร์รับทราบ",     icon: "♿", needEdit: true,  needAdmin: false, accent: Theme.Green },
          { key: "admin",   title: "จัดการระบบ",         sub: "สิทธิ์ · PIN · ผู้ใช้",         icon: "⚙", needEdit: true,  needAdmin: true,  accent: Theme.Ink }
        );
        Set(varHWho, Coalesce(varMe.display_name, User().FullName, "ผู้ใช้"))
    Children:
      - recHHead:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =Theme.Navy
            Height: =Sp.HeadTall
            Width: =Parent.Width
            X: =0
            Y: =0
      - lblHTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="PAS · ระบบจัดกำลังพล PSA-HKT"
            Color: =Theme.OnDark
            FontWeight: =FontWeight.Bold
            Size: =Sz.H1
            X: =Sp.Gutter
            Y: =14
            Width: =Parent.Width - 210
            Height: =34
      - lblHWho:
          Control: Label@2.5.1
          Properties:
            Text: ="สวัสดี " & varHWho
            Color: =RGBA(220, 230, 250, 1)
            Size: =Sz.Body
            X: =Sp.Gutter
            Y: =50
            Width: =Parent.Width - 400
            Height: =24
      - btnHSignIn:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="เข้าด้วย PIN / เปลี่ยนผู้ใช้"
            Fill: =RGBA(0, 0, 0, 0)
            Color: =RGBA(220, 230, 250, 1)
            BorderColor: =RGBA(120, 150, 210, 1)
            Size: =Sz.Cap
            X: =Parent.Width - 210 - Sp.Gutter
            Y: =50
            Width: =210
            Height: =26
            OnSelect: |-
              =Set(varRole, Blank()); Set(varPriv, Blank()); Set(varAdmin, Blank()); Set(varMe, Blank()); Set(varMyCode, Blank());
              Navigate(scrSignIn)
      - lblHRole:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            Color: =Theme.OnDark
            Fill: =If(varAdmin, Theme.Ink, If(varPriv, Theme.Green, Theme.Sub))
            Size: =Sz.Cap
            Text: =If(varAdmin, "ADMIN · หลังบ้าน", If(varPriv, "แก้ไขได้ · " & varRole, "ดูอย่างเดียว"))
            Width: =170
            Height: =30
            X: =Parent.Width - 170 - Sp.Gutter
            Y: =16
      - galHMenu:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: =Filter(colHMenu, (!needEdit || varPriv) && (!needAdmin || varAdmin))
            TemplateSize: =Sp.Tile + 12
            TemplatePadding: =Sp.Gap
            WrapCount: =Max(1, RoundDown(Self.Width / ColW, 0))
            X: =Sp.Gutter
            Y: =Sp.HeadTall + Sp.Gap * 2
            Width: =Parent.Width - Sp.Gutter * 2
            Height: =Parent.Height - Sp.HeadTall - Sp.Gap * 3
            TemplateFill: =RGBA(0, 0, 0, 0)
          Children:
            - recHCard:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =Theme.Card
                  X: =4
                  Y: =4
                  Width: =Parent.TemplateWidth - Sp.Gap * 2
                  Height: =Parent.TemplateHeight - Sp.Gap - 4
            - recHBar:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =ThisItem.accent
                  X: =4
                  Y: =4
                  Width: =6
                  Height: =Parent.TemplateHeight - Sp.Gap - 4
            - lblHIcon:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.icon
                  Size: =28
                  X: =20
                  Y: =14
                  Width: =44
                  Height: =48
            - lblHCardT:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.title
                  Color: =Theme.Ink
                  FontWeight: =FontWeight.Bold
                  Size: =Sz.H2
                  X: =70
                  Y: =20
                  Width: =Parent.TemplateWidth - 90
                  Height: =26
            - lblHCardS:
                Control: Label@2.5.1
                Properties:
                  Text: =ThisItem.sub
                  Color: =Theme.Sub
                  Size: =Sz.Cap
                  X: =70
                  Y: =48
                  Width: =Parent.TemplateWidth - 90
                  Height: =22
            - btnHGo:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =""
                  Fill: =RGBA(0, 0, 0, 0)
                  HoverFill: =RGBA(29, 66, 138, 0.06)
                  PressedFill: =RGBA(29, 66, 138, 0.12)
                  BorderColor: =RGBA(0, 0, 0, 0)
                  Color: =RGBA(0, 0, 0, 0)
                  X: =4
                  Y: =4
                  Width: =Parent.TemplateWidth - Sp.Gap * 2
                  Height: =Parent.TemplateHeight - Sp.Gap - 4
                  OnSelect: |-
                    =Switch(ThisItem.key,
                      "day",     Navigate(scrDay),
                      "my",      Navigate(scrMe),
                      "roster",  Navigate(scrRoster),
                      "assign",  Navigate(scrAssign),
                      "flights", Navigate(scrFlights),
                      "wh",      Navigate(scrWH),
                      "ot",      Navigate(scrOT),
                      "lpp",     Navigate(scrLP),
                      "admin",   Navigate(scrAdminRoles)
                    )
