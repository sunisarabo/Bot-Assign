Screens:
  scrAdminRoles:
    Properties:
      Fill: =RGBA(244, 246, 248, 1)
      OnVisible: |-
        =If(IsBlank(varAdmin), Set(varAdmin, varRole = "Admin"));
        If(!varAdmin, Notify("เฉพาะผู้ดูแลระบบ (Admin)", NotificationType.Error); Navigate(scrHome));
        If(IsBlank(colARStaff),
          ClearCollect(colARStaff, ForAll(SortByColumns(Filter(PAS_Employees, status.Value = "ACTIVE"), "emp_code") As s, { lbl: s.emp_name & " · " & s.emp_code, code: s.emp_code })))
    Children:
      - recARHead:
          Control: Rectangle@2.3.0
          Properties:
            Fill: =RGBA(60, 60, 60, 1)
            Height: =64
            Width: =Parent.Width
      - lblARTitle:
          Control: Label@2.5.1
          Properties:
            Text: ="จัดการสิทธิ์ผู้ใช้ (Admin)"
            Color: =RGBA(255, 255, 255, 1)
            FontWeight: =FontWeight.Bold
            Size: =18
            X: =20
            Y: =12
            Width: =Parent.Width - 260
            Height: =40
      - btnARBack:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="← กลับเมนู"
            OnSelect: =Navigate(scrHome)
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(60, 60, 60, 1)
            X: =Parent.Width - 130
            Y: =14
            Width: =110
            Height: =36
      - lblARUsers:
          Control: Label@2.5.1
          Properties:
            Text: ="ผู้ใช้ที่มีบัญชี M365 (role + สถานะ)"
            FontWeight: =FontWeight.Semibold
            Size: =13
            X: =20
            Y: =74
            Width: =Parent.Width - 40
            Height: =24
      - galAR:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Items: =SortByColumns(PAS_Users, "display_name")
            TemplateSize: =56
            TemplatePadding: =4
            X: =16
            Y: =102
            Width: =Parent.Width - 32
            Height: =Parent.Height - 300
            TemplateFill: =RGBA(255, 255, 255, 1)
          Children:
            - lblARName:
                Control: Label@2.5.1
                Properties:
                  Text: =Coalesce(ThisItem.display_name, "—") & "   " & ThisItem.Title
                  Size: =12
                  X: =12
                  Y: =6
                  Width: =Parent.TemplateWidth - 340
                  Height: =44
            - ddARRole:
                Control: Classic/DropDown@2.3.1
                Properties:
                  Items: =Choices(PAS_Users.role)
                  Default: =ThisItem.role
                  X: =Parent.TemplateWidth - 320
                  Y: =10
                  Width: =160
                  Height: =36
                  OnChange: |-
                    =If(varAdmin, Patch(PAS_Users, ThisItem, { role: ddARRole.Selected });
                       Notify("ตั้ง " & Coalesce(ThisItem.display_name, ThisItem.Title) & " = " & ddARRole.Selected.Value, NotificationType.Success))
            - btnARActive:
                Control: Classic/Button@2.2.0
                Properties:
                  Text: =If(ThisItem.active, "ใช้งาน ✓", "ปิดอยู่")
                  Fill: =If(ThisItem.active, RGBA(198, 224, 180, 1), RGBA(224, 224, 224, 1))
                  Color: =If(ThisItem.active, RGBA(45, 106, 79, 1), RGBA(90, 90, 90, 1))
                  X: =Parent.TemplateWidth - 150
                  Y: =10
                  Width: =140
                  Height: =36
                  OnSelect: |-
                    =If(varAdmin, Patch(PAS_Users, ThisItem, { active: !ThisItem.active }))
      - lblARAdd:
          Control: Label@2.5.1
          Properties:
            Text: ="+ เพิ่มผู้ใช้ M365 (อีเมล → role)"
            FontWeight: =FontWeight.Semibold
            Size: =13
            X: =20
            Y: =Parent.Height - 188
            Width: =Parent.Width - 40
            Height: =24
      - txtAREmail:
          Control: Classic/TextInput@2.3.2
          Properties:
            HintText: ="อีเมล M365 (ตัวพิมพ์เล็ก)"
            X: =20
            Y: =Parent.Height - 158
            Width: =280
            Height: =36
      - txtARDisplay:
          Control: Classic/TextInput@2.3.2
          Properties:
            HintText: ="ชื่อแสดง"
            X: =310
            Y: =Parent.Height - 158
            Width: =180
            Height: =36
      - ddARNewRole:
          Control: Classic/DropDown@2.3.1
          Properties:
            Items: =Choices(PAS_Users.role)
            X: =500
            Y: =Parent.Height - 158
            Width: =150
            Height: =36
      - btnARAdd:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="เพิ่มผู้ใช้"
            Fill: =RGBA(29, 66, 138, 1)
            Color: =RGBA(255, 255, 255, 1)
            X: =660
            Y: =Parent.Height - 158
            Width: =120
            Height: =36
            OnSelect: |-
              =If(varAdmin && !IsBlank(txtAREmail.Text),
                 Patch(PAS_Users, Defaults(PAS_Users),
                   { Title: Lower(Trim(txtAREmail.Text)), display_name: txtARDisplay.Text,
                     role: Coalesce(ddARNewRole.Selected, { Value: "Viewer" }), active: true });
                 Notify("เพิ่มผู้ใช้ " & Lower(Trim(txtAREmail.Text)) & " แล้ว", NotificationType.Success);
                 Reset(txtAREmail); Reset(txtARDisplay))
      - lblARPin:
          Control: Label@2.5.1
          Properties:
            Text: ="ตั้ง PIN ให้พนักงาน (USER ไม่มี M365 ใช้เข้า scrSignIn)"
            FontWeight: =FontWeight.Semibold
            Size: =13
            X: =20
            Y: =Parent.Height - 108
            Width: =Parent.Width - 40
            Height: =24
      - ddARPinWho:
          Control: Classic/DropDown@2.3.1
          Properties:
            Items: =colARStaff
            X: =20
            Y: =Parent.Height - 78
            Width: =300
            Height: =36
      - txtARPin:
          Control: Classic/TextInput@2.3.2
          Properties:
            HintText: ="PIN ใหม่ (4-6 หลัก)"
            X: =330
            Y: =Parent.Height - 78
            Width: =160
            Height: =36
      - btnARPinSave:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="บันทึก PIN"
            Fill: =RGBA(45, 106, 79, 1)
            Color: =RGBA(255, 255, 255, 1)
            X: =500
            Y: =Parent.Height - 78
            Width: =130
            Height: =36
            OnSelect: |-
              =If(varAdmin && !IsBlank(ddARPinWho.Selected) && Len(txtARPin.Text) >= 4,
                 Patch(PAS_Employees, LookUp(PAS_Employees, emp_code = ddARPinWho.Selected.code), { pas_pin: txtARPin.Text });
                 Notify("ตั้ง PIN ให้ " & ddARPinWho.Selected.lbl & " แล้ว", NotificationType.Success);
                 Reset(txtARPin),
                 Notify("เลือกคน + PIN ≥4 หลัก", NotificationType.Warning))
